<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vegetables</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  padding:20px;
  background:linear-gradient(-45deg,#d4edda,#a8e6a3,#c8facc,#e6ffe6);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  overflow-x:hidden;
}

/* Background animation */
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ========= Loader ========= */
#loader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #e0e0e0;
  border-top:6px solid #4caf50;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  100%{ transform:rotate(360deg); }
}
/* ========================== */

h2{
  text-align:center;
  margin-bottom:20px;
  color:#2e7d32;
  animation:fadeDown 0.6s ease;
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  max-width:420px;
  margin:auto;
}

/* Card */
.card{
  background:white;
  height:180px;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
  animation:fadeUp .6s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

.card:hover{
  transform:translateY(-6px);
  background:#f1fff1;
}

.card img{
  width:85px;
  height:65px;
  object-fit:cover;
  margin-top:10px;
  border-radius:12px;
}

/* Floating button */
.fab{
  position:fixed;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  font-size:30px;
  border:none;
  background:#4caf50;
  color:white;
  box-shadow:0 6px 15px rgba(0,0,0,.2);
  cursor:pointer;
  transition:.3s;
  animation:fabFloat 3s ease-in-out infinite;
}

.fab:hover{
  background:#2e7d32;
  transform:scale(1.1);
}

@keyframes fabFloat{
  0%{ transform:translateY(0);}
  50%{ transform:translateY(-8px);}
  100%{ transform:translateY(0);}
}

/* Floating vegetables */
.leaf{
  position:fixed;
  font-size:40px;
  opacity:0.4;
  animation:floatLeaf 18s linear infinite;
}

.leaf2{
  left:70%;
  animation-duration:22s;
}

.leaf3{
  left:40%;
  animation-duration:20s;
}

@keyframes floatLeaf{
  0%{ top:-50px; transform:rotate(0deg);}
  100%{ top:110%; transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- Floating Emojis -->
<div class="leaf">🥬</div>
<div class="leaf leaf2">🌿</div>
<div class="leaf leaf3">🍃</div>

<!-- Loader -->
<div id="loader">
  <div class="spinner"></div>
</div>

<h2>Vegetables</h2>

<div class="grid" id="menuGrid"></div>

<button class="fab"></button>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, deleteDoc, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const grid = document.getElementById("menuGrid");
const fabBtn = document.querySelector(".fab");

const phone = sessionStorage.getItem("phone");

if(!phone){
  window.isAdmin = false;
  setCartButton();
}

/* CHECK ROLE */
async function checkRole(){
  if(!phone){
    setCartButton();
    return;
  }

  const userRef = doc(db,"users",phone);
  const userSnap = await getDoc(userRef);

  if(userSnap.exists() && userSnap.data().isAdmin === true){
      fabBtn.innerHTML = "+";
      fabBtn.onclick = () => location.href='add-vegetables.html';
      window.isAdmin = true;
  }else{
      setCartButton();
      window.isAdmin = false;
  }
}

function setCartButton(){
  fabBtn.innerHTML = "🛒";
  fabBtn.onclick = () => location.href='cart.html';
}

/* LOAD VEGETABLES */
async function loadMenu(){
  try{
    const snapshot = await getDocs(collection(db, "vegetables"));

    snapshot.forEach(docSnap => {

      const data = docSnap.data();
      if(!data.name) return;

      const itemName = data.name;

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div>${itemName}</div>
        ${data.image ? `<img src="${data.image}">` : ""}
      `;

      div.addEventListener("click", ()=>{
        const base = itemName.toLowerCase().replace(/\s+/g,'-');

        if(window.isAdmin){
          location.href = base + "-manage.html";
        }else{
          location.href = base + "-list.html";
        }
      });

      /* Delete for Admin */
      div.addEventListener("contextmenu", async (e)=>{
        if(!window.isAdmin) return;
        e.preventDefault();

        if(confirm(`Delete "${itemName}"?`)){
          await deleteDoc(doc(db,"vegetables",docSnap.id));
          div.remove();
        }
      });

      let timer;
      div.addEventListener("touchstart", ()=>{
        if(!window.isAdmin) return;

        timer = setTimeout(async ()=>{
          if(confirm(`Delete "${itemName}"?`)){
            await deleteDoc(doc(db,"vegetables",docSnap.id));
            div.remove();
          }
        },700);
      });

      div.addEventListener("touchend", ()=>{
        clearTimeout(timer);
      });

      grid.appendChild(div);
    });

  }catch(err){
    console.error(err);
    alert("Failed to load vegetables");
  }

  document.getElementById("loader").style.display="none";
}

await checkRole();
await loadMenu();
</script>

</body>
</html>
