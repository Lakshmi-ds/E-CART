<!DOCTYPE html>
<html>
<head>
  <title>Edit Vegetable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  padding:20px;
  background:linear-gradient(-45deg,#d4edda,#a8e6a3,#c8facc,#e6ffe6);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  overflow-x:hidden;
}

/* Background animation */
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h2{
  text-align:center;
  color:#2e7d32;
  animation:fadeDown 0.6s ease;
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}

/* Form Card */
.form-box{
  max-width:420px;
  margin:20px auto;
  background:white;
  padding:25px;
  border-radius:25px;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
  animation:fadeUp 0.7s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

input, textarea{
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:12px;
  border:1px solid #c8e6c9;
  font-size:14px;
  transition:0.3s;
}

input:focus, textarea:focus{
  outline:none;
  border-color:#66bb6a;
  box-shadow:0 0 10px #a5d6a7;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#4caf50;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#2e7d32;
  transform:scale(1.05);
}
</style>
</head>
<div class="leaf">🥬</div>
<div class="leaf leaf2">🌿</div>
<div class="leaf leaf3">🍃</div>
<style>
.leaf{
  position:fixed;
  font-size:40px;
  opacity:0.4;
  animation:floatLeaf 18s linear infinite;
}

.leaf2{
  left:70%;
  animation-duration:22s;
}

.leaf3{
  left:40%;
  animation-duration:20s;
}

@keyframes floatLeaf{
  0%{ top:-50px; transform:rotate(0deg);}
  100%{ top:110%; transform:rotate(360deg);}
}
</style>
<body>

<h2>Edit Vegetable</h2>

<input id="category" placeholder="Category">
<input id="market" placeholder="Market Price">
<input id="offer" placeholder="Offer Price">

<input id="nutrition1" placeholder="Nutrition 1">
<input id="nutrition2" placeholder="Nutrition 2">

<textarea id="area" placeholder="Areas (comma separated)"></textarea>

<button id="update">Update</button>


<script type="module">
import { db, doc } from "./firebase.js";
import { getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 get id from URL
const id = new URLSearchParams(window.location.search).get("id");

// 🔥 load existing data
const snap = await getDoc(doc(db, "vegetables", id));

if (snap.exists()) {
  const data = snap.data();

  document.getElementById("category").value = data.category || "";
  document.getElementById("market").value = data.market || "";
  document.getElementById("offer").value = data.offer || "";
  document.getElementById("nutrition1").value = data.nutrition1 || "";
  document.getElementById("nutrition2").value = data.nutrition2 || "";
  document.getElementById("area").value = (data.area || []).join(", ");
}


// 🔥 update data
document.getElementById("update").onclick = async () => {

  await updateDoc(doc(db, "vegetables", id), {
    category: category.value,
    market: market.value,
    offer: offer.value,
    nutrition1: nutrition1.value,
    nutrition2: nutrition2.value,
    area: area.value.split(",").map(a => a.trim())
  });

  alert("Updated Successfully");

  // go back
  location.href = "vegetables.html";
};
</script>

</body>
</html>
