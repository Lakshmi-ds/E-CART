<!DOCTYPE html>
<html>
<head>
<title>Add angda</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family:Arial;
    margin:0;
    padding:20px;
    min-height:100vh;
    background: linear-gradient(to bottom, #0096c7, #48cae4, #ade8f4);
    overflow:hidden;
}

/* 🌊 Aquarium Background */
.aquarium{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

.fish, .crab{
    position:absolute;
    font-size:42px;
    opacity:0.35;
}

.left{ animation: swimLeft linear infinite; }
.right{ animation: swimRight linear infinite; }

.f1{ top:15%; animation-duration:18s; }
.f2{ top:35%; animation-duration:22s; }
.f3{ top:55%; animation-duration:25s; }
.f4{ top:75%; animation-duration:20s; }

@keyframes swimRight{
    0%{ left:-10%; }
    100%{ left:110%; }
}

@keyframes swimLeft{
    0%{ left:110%; transform:scaleX(-1); }
    100%{ left:-10%; transform:scaleX(-1); }
}

/* 🦀 Crab walking bottom */
.crab{
    bottom:10px;
    left:-10%;
    font-size:50px;
    animation: walk 30s linear infinite;
}

@keyframes walk{
    0%{ left:-10%; }
    100%{ left:110%; }
}

/* 🫧 Bubbles */
.bubble{
    position:absolute;
    bottom:-50px;
    font-size:22px;
    opacity:0.3;
    animation: rise linear infinite;
}

@keyframes rise{
    0%{ transform:translateY(0); opacity:0.4; }
    100%{ transform:translateY(-1000px); opacity:0; }
}

/* 🌟 Floating Glass Form */
.container{
    max-width:450px;
    margin:auto;
    position:relative;
    z-index:2;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:25px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation: floatBox 4s ease-in-out infinite alternate;
}

@keyframes floatBox{
    from{ transform:translateY(0px); }
    to{ transform:translateY(-10px); }
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    border:2px solid white;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
}

input::placeholder,
textarea::placeholder{
    color:#eef;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:25px;
    background:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#caf0f8;
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 🌊 Animated Aquarium -->
<div class="aquarium">
    <!-- Fish -->
    <div class="fish right f1">🐟</div>
    <div class="fish left f2">🐠</div>
    <div class="fish right f3">🐡</div>
    <div class="fish left f4">🐟</div>

    <!-- angda -->
    <div class="angda"></div>

    <!-- Bubbles -->
    <div class="bubble" style="left:10%; animation-duration:12s;">🫧</div>
    <div class="bubble" style="left:25%; animation-duration:16s;">🫧</div>
    <div class="bubble" style="left:40%; animation-duration:14s;">🫧</div>
    <div class="bubble" style="left:60%; animation-duration:18s;">🫧</div>
    <div class="bubble" style="left:80%; animation-duration:20s;">🫧</div>
</div>

<div class="container">
<h2>Add angda</h2>

<input id="category" placeholder="Category">
<input id="market" placeholder="Market Price">
<input id="offer" placeholder="Offer Price">

<input id="nutrition1" placeholder="Nutrition 1">
<input id="nutrition2" placeholder="Nutrition 2">

<textarea id="area" placeholder="Area (comma separated)"></textarea>

<button id="save">Save</button>
</div>

<script type="module">
import { db, collection, addDoc } from "./firebase.js";

document.getElementById("save").onclick = async () => {

  const category = document.getElementById("category").value;
  const market = document.getElementById("market").value;
  const offer = document.getElementById("offer").value;
  const nutrition1 = document.getElementById("nutrition1").value;
  const nutrition2 = document.getElementById("nutrition2").value;

  const area = document.getElementById("area").value
                .split(",")
                .map(a => a.trim());

  await addDoc(collection(db, "bangda"), {
    category,
    market,
    offer,
    nutrition1,
    nutrition2,
    area
  });

  alert("Added Successfully 🦀");
  location.href = "bangda-list.html";
};
</script>

</body>
</html>
