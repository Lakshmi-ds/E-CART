<!DOCTYPE html>
<html>
<head>
  <title>Carror List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  padding:20px;
  background:linear-gradient(-45deg,#d4edda,#a8e6a3,#c8facc,#e6ffe6);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  overflow-x:hidden;
}

/* Background animation */
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h2{
  text-align:center;
  color:#2e7d32;
  animation:fadeDown 0.6s ease;
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}

#list{
  max-width:420px;
  margin:20px auto;
}

/* List Item Card */
.item{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:18px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  transition:0.3s;
  animation:fadeUp 0.6s ease;
}

.item:hover{
  transform:translateY(-5px);
  background:#f1fff1;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

.item b{
  color:#1b5e20;
  font-size:18px;
}

/* Floating Add Button */
.fab{
  position:fixed;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#4caf50;
  color:white;
  border:none;
  font-size:30px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
  transition:0.3s;
  animation:fabFloat 3s ease-in-out infinite;
}

.fab:hover{
  background:#2e7d32;
  transform:scale(1.1);
}

@keyframes fabFloat{
  0%{ transform:translateY(0);}
  50%{ transform:translateY(-8px);}
  100%{ transform:translateY(0);}
}
</style>
</head>
<div class="leaf">🥬</div>
<div class="leaf leaf2">🌿</div>
<div class="leaf leaf3">🍃</div>
<style>
.leaf{
  position:fixed;
  font-size:40px;
  opacity:0.4;
  animation:floatLeaf 18s linear infinite;
}

.leaf2{
  left:70%;
  animation-duration:22s;
}

.leaf3{
  left:40%;
  animation-duration:20s;
}

@keyframes floatLeaf{
  0%{ top:-50px; transform:rotate(0deg);}
  100%{ top:110%; transform:rotate(360deg);}
}
</style>
<body>

<h2>Carrot</h2>
<div id="list"></div>

<button class="fab" onclick="location.href='add-carrot.html'">+</button>

<script type="module">
import { db, collection, getDocs } from "./firebase.js";

const list = document.getElementById("list");

const snapshot = await getDocs(collection(db, "carrot"));

snapshot.forEach(docSnap => {
  const data = docSnap.data();

  const div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    <b>${data.category}</b><br>
    Market: ${data.market} | Offer: ${data.offer}
  `;

  div.onclick = () => {
    location.href = `edit-carrot.html?id=${docSnap.id}`;
  };

  list.appendChild(div);
});
</script>

</body>
</html>
