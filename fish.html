<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family: Arial;
  padding:20px;
  margin:0;
  min-height:100vh;
  background: linear-gradient(to bottom, #0077b6, #90e0ef);
  overflow:hidden;
}

/* 🌊 Aquarium Background */
.aquarium{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* 🐟 Fish - darker now */
.fish{
  position:absolute;
  font-size:50px; /* slightly bigger */
  opacity:0.9;    /* darker for visibility */
}

.left{
  animation: swimLeft 25s linear infinite;
}

.right{
  animation: swimRight 30s linear infinite;
}

.f1{ top:20%; animation-duration:18s; }
.f2{ top:50%; animation-duration:25s; }
.f3{ top:75%; animation-duration:22s; }

@keyframes swimRight{
  0%{ left:-10%; }
  100%{ left:110%; }
}

@keyframes swimLeft{
  0%{ left:110%; transform:scaleX(-1); }
  100%{ left:-10%; transform:scaleX(-1); }
}

/* 🫧 Bubbles - varied speed and size */
.bubble{
  position:absolute;
  bottom:-50px;
  opacity:1.9;
  animation-name: rise;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.bubble1{ left:5%; font-size:18px; animation-duration:16s; animation-delay:0s; }
.bubble2{ left:15%; font-size:22px; animation-duration:20s; animation-delay:3s; }
.bubble3{ left:30%; font-size:20px; animation-duration:18s; animation-delay:1s; }
.bubble4{ left:45%; font-size:25px; animation-duration:22s; animation-delay:4s; }
.bubble5{ left:60%; font-size:19px; animation-duration:17s; animation-delay:2s; }
.bubble6{ left:75%; font-size:23px; animation-duration:21s; animation-delay:5s; }
.bubble7{ left:85%; font-size:20px; animation-duration:19s; animation-delay:1.5s; }

@keyframes rise{
  0%{ transform:translateY(0); opacity:0.4; }
  100%{ transform:translateY(-1000px); opacity:0; }
}

/* Loader */
#loader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #e0e0e0;
  border-top:6px solid #2196f3;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  100%{ transform:rotate(360deg); }
}

/* Content above animation */
h2, .grid, .fab{
  position:relative;
  z-index:2;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  max-width:500px;
  margin:auto;
}

/* Card Glass Effect - larger and lighter background */
.card{
  background:rgba(255,255,255,0.15); /* lighter */
  backdrop-filter:blur(10px);
  border-radius:20px;
  height:180px; /* slightly taller */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  color:white;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.card img{
  width:70px;  /* slightly bigger */
  height:70px;
  object-fit:cover;
  margin-top:8px;
  border-radius:10px;
}

/* Floating button */
.fab{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  font-size:28px;
  border:none;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
  cursor:pointer;
}
</style>
</head>

<body>

<!-- 🌊 Aquarium Background -->
<div class="aquarium">
  <div class="fish right f1">🐟</div>
  <div class="fish left f2">🐠</div>
  <div class="fish right f3">🐡</div>

  <!-- Bubbles with varied speed and size -->
  <div class="bubble bubble1">🫧</div>
  <div class="bubble bubble2">🫧</div>
  <div class="bubble bubble3">🫧</div>
  <div class="bubble bubble4">🫧</div>
  <div class="bubble bubble5">🫧</div>
  <div class="bubble bubble6">🫧</div>
  <div class="bubble bubble7">🫧</div>
</div>

<div id="loader">
  <div class="spinner"></div>
</div>

<h2 style="text-align:center; color:white;">Fish</h2>

<div class="grid" id="menuGrid"></div>

<button class="fab" id="fabBtn">+</button>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, deleteDoc, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const grid = document.getElementById("menuGrid");
const fabBtn = document.getElementById("fabBtn");
const phone = sessionStorage.getItem("phone");

if(!phone){
  location.href = "index.html";
}

async function checkRole(){
  const userRef = doc(db,"users",phone);
  const userSnap = await getDoc(userRef);

  if(userSnap.exists()){
    const data = userSnap.data();

    if(data.isAdmin === true){
      fabBtn.innerHTML = "+";
      fabBtn.onclick = () => location.href='add-fish.html';
      window.isAdmin = true;
    }else{
      fabBtn.innerHTML = "🛒";
      fabBtn.onclick = () => location.href='cart.html';
      window.isAdmin = false;
    }
  }
}

async function loadFish(){
  const snapshot = await getDocs(collection(db,"fish"));

  snapshot.forEach(docSnap=>{
    const data = docSnap.data();
    if(!data.name) return;

    const div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <div>${data.name}</div>
      ${data.image ? `<img src="${data.image}">` : ""}
    `;

    div.onclick=()=>{
      const base = data.name.toLowerCase().replace(/\s+/g,'-');
      if(window.isAdmin){
        location.href = base + "-manage.html";
      }else{
        location.href = base + "-list.html";
      }
    };

    div.oncontextmenu=async(e)=>{
      if(!window.isAdmin) return;
      e.preventDefault();
      if(confirm("Delete \"" + data.name + "\"?")){
        await deleteDoc(doc(db,"fish",docSnap.id));
        div.remove();
      }
    };

    grid.appendChild(div);
  });

  document.getElementById("loader").style.display="none";
}

await checkRole();
await loadFish();
</script>

</body>
</html>
